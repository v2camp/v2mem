name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/install.sh scripts/test-install.sh scripts/release-assets.sh scripts/publish-release.sh
      - name: install script tests
        run: bash scripts/test-install.sh
